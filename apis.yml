name: Kobalt Music
description: Kobalt Music Group is a music services company providing publishing administration,
  neighbouring rights and recordings services for songwriters, artists, publishers and rights holders.
  It collects, matches and accounts for royalties across streaming and digital platforms, reporting to
  clients through its own portals rather than a public developer program. Kobalt's rights and content
  management platform is operated by KTech, its technology arm, which processes the micro-transaction
  royalty data behind Kobalt Music Publishing and AMRA, the global digital collection society. As of
  the July 2026 enrichment pass Kobalt publishes no public API, API documentation, or machine-readable
  API specification; the only public machine-readable surface found was an RFC 9116 security.txt.
